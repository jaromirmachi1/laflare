    <main id="Main" class="lock-form">
      <form onsubmit="event.preventDefault();const p=this.querySelector('[data-lock-pill]');p.classList.remove('is-shake');void p.offsetWidth;p.classList.add('is-shake');this.querySelector('.lock-form__error').hidden=false;">
        <div class="lock-form__pill" data-lock-pill data-error="false">
          <label class="lock-form__label" for="LockPassword">Password</label>
          <input id="LockPassword" class="lock-form__input" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
          <button class="atc" type="submit">Enter</button>
        </div>
        <p class="lock-form__error" role="alert" hidden>Wrong password</p>
      </form>
    </main>
